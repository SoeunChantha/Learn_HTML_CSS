2f.challenge Exercise: Continuing from exercise 1g, recreate this design using css. <br>
<style>
    *{font-family: Arial, Helvetica, sans-serif;}
    .Link-back-to-amazon:hover{
        color: blue;
    }

    .title{
        font-weight: bold;
        font-size: 25px;
    }

    .Price-color{
        color: rgb(35, 132, 62);
        font-weight: bold;
    }

    .Add-to-cart-btn{
        background: rgb(255,216,20);
        border: none;
        border-radius: 15px;
        height: 30px;
        width: 110px;
        cursor: pointer;
        margin-right: 8px;
    }
    .Add-to-cart-btn:hover{
        background-color: rgb(247, 202, 0);
    }
    .Add-to-cart-btn:active{
        opacity: 0.5;
    }

    .Buy-now-btn{
        background: rgb(240, 138, 13);
        border: none;
        border-radius: 15px;
        height: 30px;
        width: 110px;
        cursor: pointer;
    }
    .Buy-now-btn:hover{
        background-color: rgb(255, 164, 28);
    }
    .Buy-now-btn:active{
        opacity: 0.5;
    }

</style>
<a href="https://www.amazon.com/" class="Link-back-to-amazon">Back to Amazon</a>
<p class="title">Nike Black Running Shoes</p>
<p class="Price-color" >$39 -in stock.</p>
<p>Free delivery tomorrow.</p>
<button class="Add-to-cart-btn">Add to cart</button>
<button class="Buy-now-btn">Buy now</button>
