<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="./web.css">
</head>
<body>
    <div class=" contact container-contact">
        <div class=" contact-wrapper">
            <section class="contact-site">
                <h1>Contact Us</h1>
                <p>Welcome to SC plant of <span>life. We love hear from you.</span></p>
                
                <form class="contact-form">
                    <input type="text" name="name" placeholder="Your name" required>
                    <input type="email" name="email" placeholder="Your email" required>
                    <textarea name="message" id="" placeholder="Your message"></textarea>
                   <div id="btn">
                       <button type="submit" class="btn-read-more" >Send Message</button>
                   </div>
                </form>
            </section>
        </div>
    </div>
</body>
</html>
