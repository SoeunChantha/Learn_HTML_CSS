<style>
    .Request-now-btn{
        background: #000;
        color: white;
        height: 40px;
        width: 110px;
        border: none;
        cursor: pointer;
        transition: opacity 0.15s;
    }
    .Request-now-btn:hover{
        opacity: 0.8;
    }
</style>
<button class="Request-now-btn">Request now</button>
